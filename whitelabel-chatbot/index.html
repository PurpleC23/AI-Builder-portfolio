<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* LAUNCHER BUTTON */
  #chat-launcher {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    background: #6c3fc5;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(108,63,197,0.4);
    transition: transform 0.2s;
    z-index: 1000;
  }
  #chat-launcher:hover { transform: scale(1.1); }
  #chat-launcher svg { width: 28px; height: 28px; fill: white; }

  /* CHAT WINDOW */
  #chat-window {
    position: fixed;
    bottom: 100px;
    right: 30px;
    width: 370px;
    height: 520px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
  }
  #chat-window.open { display: flex; }

  /* HEADER */
  #chat-header {
    background: #6c3fc5;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #chat-header .avatar {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  #chat-header .info h3 {
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  #chat-header .info p {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
  }
  #chat-header .status {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    margin-left: auto;
  }

  /* MESSAGES */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .message.bot {
    background: #f0ecff;
    color: #2d1b69;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .message.user {
    background: #6c3fc5;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .typing {
    background: #f0ecff;
    color: #6c3fc5;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
  }

  /* INPUT */
  #chat-input-area {
    padding: 16px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #chat-input {
    flex: 1;
    border: 1px solid #e0e0e0;
    border-radius: 24px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  #chat-input:focus { border-color: #6c3fc5; }
  #send-btn {
    width: 40px;
    height: 40px;
    background: #6c3fc5;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #send-btn:hover { background: #5a32a3; }
  #send-btn svg { width: 18px; height: 18px; fill: white; }
</style>
</head>
<body>

<!-- Demo page content -->
<div style="text-align:center; color:#666;">
  <h2 style="color:#2d1b69; font-size:28px; margin-bottom:12px;">AI Lead Chatbot Demo</h2>
  <p>Click the purple button to start a conversation</p>
</div>

<!-- LAUNCHER -->
<div id="chat-launcher" onclick="toggleChat()">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</div>

<!-- CHAT WINDOW -->
<div id="chat-window">
  <div id="chat-header">
    <img src="avatar.png" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
    <div class="info">
      <h3>AI Assistant</h3>
      <p>Typically replies instantly</p>
    </div>
    <div class="status"></div>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Type a message..." onkeypress="handleKey(event)">
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
  // YOUR N8N WEBHOOK URL — replace this
  const WEBHOOK_URL = 'http://localhost:5678/webhook/lead-chat';
  
  // Generate unique session ID for this visitor
  const SESSION_ID = 'session-' + Math.random().toString(36).substr(2, 9);
  
  let chatOpen = false;
  let greeted = false;

  function toggleChat() {
    chatOpen = !chatOpen;
    const window_ = document.getElementById('chat-window');
    window_.classList.toggle('open', chatOpen);
    
    // Send greeting on first open
    if (chatOpen && !greeted) {
      greeted = true;
      setTimeout(() => {
        addMessage('bot', 'Hi there! I\'m here to help. What brings you to our site today?');
      }, 500);
    }
  }

  function addMessage(role, text) {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.textContent = 'Typing...';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    // Show user message
    addMessage('user', message);
    input.value = '';

    // Show typing indicator
    showTyping();

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: SESSION_ID,
          message: message,
          timestamp: new Date().toISOString(),
          page_url: window.location.href
        })
      });

      const data = await response.json();
      hideTyping();

      if (data.lead_captured) {
        addMessage('bot', data.reply);
        // Disable input after lead captured
        input.disabled = true;
        input.placeholder = 'Thank you! We will be in touch.';
        document.getElementById('send-btn').disabled = true;
      } else {
        addMessage('bot', data.reply);
      }

    } catch(err) {
      hideTyping();
      addMessage('bot', 'Sorry, something went wrong. Please try again.');
    }
  }

  function handleKey(event) {
    if (event.key === 'Enter') sendMessage();
  }
</script>
</body>
</html>
